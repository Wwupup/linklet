[package]
name = "linklet-agent"
version = { workspace = true }
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The target-side agent: a standalone executable that runs a command when asked."

[[bin]]
name = "linklet-agent"
path = "src/main.rs"

[[bin]]
name = "linklet-tray"
path = "src/tray.rs"

[dependencies]
serde_json.workspace = true
linklet-adapters = { path = "../linklet-adapters" }
# The protocol, and nothing else. The agent and the host decode the same
# definitions out of the same module, so they cannot come to disagree about what
# a message is -- which is the failure a wire format is most likely to have and
# the hardest to notice.
linklet-core = { path = "../linklet-core" }

[lints]
workspace = true

[target."cfg(windows)".dependencies]
clipboard-win = "5"
rfd = { version = "0.17", default-features = false }
tao = { version = "0.37", default-features = false, features = ["rwh_06"] }
tray-icon = { version = "0.26", default-features = false }
