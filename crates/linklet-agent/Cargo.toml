[package]
name = "linklet-agent"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The target-side agent: one file, no dependencies, runs a command when asked."

[[bin]]
name = "linklet-agent"
path = "src/main.rs"

[dependencies]
# The protocol, and nothing else. The agent and the host decode the same
# definitions out of the same module, so they cannot come to disagree about what
# a message is -- which is the failure a wire format is most likely to have and
# the hardest to notice.
linklet-core = { path = "../linklet-core" }

[lints]
workspace = true
