[package]
name = "linklet-client"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The host side of the agent protocol: ask a target to run something."

[dependencies]
# The protocol, and nothing else -- the same single dependency the agent has, so
# the two ends of a message are decoded by the same code.
linklet-core = { path = "../linklet-core" }

# No dev-dependency on the agent, although the integration test spawns its
# binary. `linklet-agent` has no library target, so cargo ignores it as a
# dependency and warns -- a declaration that does nothing is worse than none,
# because a reader believes it. The test finds the binary on disk and says so
# when it cannot, which is the honest version of the same intent.

[lints]
workspace = true
