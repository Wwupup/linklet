# Attach the release to a GitHub release, from a tag: one archive holding the binaries and
# everything that goes with them, and one SHA256SUMS to verify it with.
#
# `docs/VERSIONING.md` is the policy this implements. Its step 7 is the part that belongs here:
# *"build and keep the binaries... `git` does not hold build output and must not. The tag is the
# source, and the binaries are a function of it."* A workflow that builds on a tag is that
# sentence done by a machine instead of by hand. Everything else in the archive is the same
# sentence about a different subject: it is not built at all, it is copied out of the tag.
#
# # What this deliberately does not do
#
# **It does not decide that a release is ready.** Steps 1 to 5 of that checklist are a person
# running the gates and driving a real machine, and no workflow can stand in for the second one:
# `tools/smoke.ps1` needs a target on a network, and a runner has none. So this job starts from
# the premise that the tag was pushed on purpose, after somebody did that.
#
# **It does not install anything.** The archive is files: two executables, a client entry, a
# skill and two scripts. Putting an agent on a target is still a file copy a person makes once,
# and `integrations/README.md` says so where somebody about to try it will read it.
#
# **It does not renumber anything.** The version in `Cargo.toml` and the tag have to agree, and
# the job refuses if they do not -- rather than releasing a binary whose `--version` disagrees
# with the tag it is attached to. That failure has already happened once by hand: a workspace
# version was bumped while five crates kept their own, so the binary reported 0.1.0 after the
# release was called 0.2.0. `crates/linklet-core/tests/architecture.rs` now fails on the cause;
# this is the check on the symptom, at the one moment it would reach a user.

name: release

on:
  push:
    tags: ["v*"]

# One release per tag, and no cancelling: a half-finished release is worse than a queued one, and
# the tag is already pushed either way.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  # Writing a release needs this and nothing else. The default token can read the repository; the
  # job is explicit about the one extra thing it wants.
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: build and attach
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      # See the note in `verify.yml`: v4 runs on Node 20 and is being retired, and nothing local
      # catches that -- `actionlint` flags `@v3` and does not flag `@v4`.
      - uses: actions/checkout@v5

      - name: Install the pinned toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.95.0"

      - name: Cache the build
        uses: Swatinem/rust-cache@v2
        with:
          key: release

      # **The tag and the manifest have to agree**, checked before a single byte is built. The tag
      # is what a user downloads under; the manifest is what the binary reports when asked. A
      # release where those disagree is a release that lies about itself quietly.
      - name: The tag and Cargo.toml agree
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}" -replace '^v', ''
          $line = Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"'
          if (-not $line) { Write-Error "no version in [workspace.package]"; exit 1 }
          $manifest = $line.Matches[0].Groups[1].Value

          Write-Host "tag says      : $tag"
          Write-Host "Cargo.toml says: $manifest"

          if ($tag -ne $manifest) {
            Write-Error "tag v$tag does not match the workspace version $manifest. Bump Cargo.toml in a commit the tag points at, or tag the right commit. See docs/VERSIONING.md."
            exit 1
          }

      # The gates, again, on the exact commit being released. Not redundant with the branch run:
      # a tag can be pushed on a commit whose branch run was cancelled, and a release is the worst
      # place to find that out.
      - name: Verify
        shell: pwsh
        run: ./tools/verify.ps1

      # `--locked` because the whole point of a release is that it is the thing that was verified.
      # A build that quietly resolved a newer dependency is a different artifact from the one the
      # gates passed on.
      - name: Build the release binaries
        shell: pwsh
        run: cargo build --workspace --release --locked

      # **One archive, because a release is one thing to download.** The binaries are
      # self-contained -- no runtime, no dependencies -- so an archive is not needed to make
      # them run; it is needed to make a release *coherent*. Four loose assets asked the
      # person downloading to work out which of them went where, and the executables and the
      # skill that explains how to use them are two halves of the same product.
      #
      # The item list is explicit rather than "everything except .git", which is
      # `make_release.ps1`'s rule in the sibling project and the right one here: a file
      # nobody listed is simply not shipped, so a new working file cannot reach a release by
      # existing. **Every item is checked before anything is archived**, because a package
      # that quietly lost the skill would still publish and would only be missed by whoever
      # tried to follow it.
      #
      # `bin/` and not the archive root, so that the executables can go on a target or into a
      # directory on `PATH` without dragging the documentation with them.
      - name: Stage the release
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          $root = "linklet-$version"
          $stage = "dist/$root"
          Remove-Item -Recurse -Force $stage -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path "$stage/bin" | Out-Null

          # The things that are built, and the only files here that are not in the tag.
          foreach ($name in 'linklet.exe', 'linklet-agent.exe') {
            $from = "target/release/$name"
            if (-not (Test-Path $from)) { Write-Error "$from was not built"; exit 1 }
            Copy-Item $from "$stage/bin/$name"
          }

          # Everything else is a file from the tag.
          $payload = @(
            'README.md'
            'CHANGELOG.md'
            'LICENSE'
            'docs/MCP.md'
            'docs/machine.md'
            'docs/smoke.md'
            'integrations'
            'tools/linklet-supervise.ps1'
            'tools/smoke.ps1'
          )

          foreach ($item in $payload) {
            if (-not (Test-Path $item)) { Write-Error "the release needs $item, which is not in the tag"; exit 1 }
            if (Test-Path $item -PathType Container) {
              Copy-Item $item $stage -Recurse -Force
            } else {
              New-Item -ItemType Directory -Force -Path (Split-Path (Join-Path $stage $item)) | Out-Null
              Copy-Item $item (Join-Path $stage $item) -Force
            }
          }

          # One top-level folder, so that unzipping into a shared directory does not scatter
          # a dozen entries among whatever else is there.
          Compress-Archive -Path $stage -DestinationPath "dist/$root.zip" -Force

          $prefix = (Resolve-Path $stage).Path + '\'
          Write-Host "dist/$root.zip:"
          Get-ChildItem -Recurse -File $stage |
            ForEach-Object { Write-Host "  $root/$($_.FullName.Replace($prefix, ''))" }

      # A digest beside the archive, because the transfer this tool performs is
      # digest-verified and it would be incoherent to hand out its own binaries without one.
      # `docs/transfer.md` T2 is the argument for the tool; this is the same courtesy to
      # whoever downloads it.
      #
      # **It stays outside the archive**, which is the one file here that is not in it: a
      # digest inside the thing it verifies cannot be used to verify it, and the archive is
      # what a download can corrupt.
      - name: Digest the archive
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          $name = "linklet-$version.zip"
          $hash = (Get-FileHash "dist/$name" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name" | Set-Content dist/SHA256SUMS -Encoding ascii
          Get-Content dist/SHA256SUMS

      # The body is a pointer and not a copy. `CHANGELOG.md` is the one place the answer to "what
      # can I do now that I could not do before" is written, and a release body that repeated it
      # would be a second copy to keep in step.
      #
      # Built by concatenation rather than as a here-string: a `@"` block in a YAML `run:` is
      # parsed as code by the shell before the here-string is recognised, and the first version
      # of this failed to parse with "use `{ instead of { in variable names". The PowerShell
      # inside these files is checked with the parser before it is committed -- see the note in
      # the commit that added it.
      - name: Write the release notes
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag -replace '^v', ''
          $blob = "${{ github.server_url }}/${{ github.repository }}/blob/$tag"

          $notes = @(
            "linklet ``$version``, built from the tag on Windows. **One archive, and one file",
            "to verify it with.**",
            "",
            "``linklet-$version.zip`` holds ``bin/`` (``linklet.exe``, the host tool and MCP",
            "server, and ``linklet-agent.exe``, which goes on each machine being driven) and the",
            "rest of a deployment: the client entry to install the MCP server, the skill that",
            "carries the order the calls go in, and the two scripts that keep an agent alive on a",
            "target. **Unzip it on the host** -- nothing here installs an agent on a target, and",
            "that first copy is a file copy, once, by hand.",
            "",
            "**What changed** is in [``CHANGELOG.md``]($blob/CHANGELOG.md), under ``[$version]``.",
            "**What a version number means here**, which changes raise it, and the upgrade order",
            "are in [``docs/VERSIONING.md``]($blob/docs/VERSIONING.md).",
            "",
            "The agent and the tool should come from the same release. **The agent may be ahead",
            "of the tool and not behind it** -- see that document for why.",
            "",
            "Verify the archive against ``SHA256SUMS`` before you unpack it."
          ) -join "`n"

          $notes | Set-Content dist/notes.md -Encoding utf8
          Get-Content dist/notes.md

      # `gh` rather than a third-party action: it is already on the runner, it is GitHub's own, and
      # a release job is not the place to add a dependency nobody reviews.
      - name: Attach to the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag -replace '^v', ''
          # `--verify-tag` so this cannot invent a tag that was not pushed.
          gh release create $tag --verify-tag --title $tag --notes-file dist/notes.md `
            "dist/linklet-$version.zip" dist/SHA256SUMS
