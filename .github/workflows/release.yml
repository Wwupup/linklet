# Attach the release to a GitHub release, from a tag: **one archive holding both platforms**, one
# SHA256SUMS to verify it with, and the notes that say what is inside.
#
# `docs/VERSIONING.md` is the policy this implements. Its step 7 is the part that belongs here:
# *"build and keep the binaries... `git` does not hold build output and must not. The tag is the
# source, and the binaries are a function of it."* A workflow that builds on a tag is that sentence
# done by a machine instead of by hand. Everything else in the archive is the same sentence about a
# different subject: it is not built at all, it is copied out of the tag.
#
# # Two build jobs and one archive, which is three jobs' worth of shape for one file
#
# A Windows-built archive cannot contain a Linux binary: each binary is built by the platform it
# runs on, and cross-compiling one from the other would mean shipping something that was never run
# on the operating system it is for. So the binaries are built where they run, uploaded as
# artifacts, and **assembled into the archive by a third job** -- which is the only job that writes
# the file a user downloads.
#
# **That job runs on Linux, and the reason is not symmetry.** A zip carries the Unix mode of every
# entry, and `Compress-Archive` writes `external_attr = 0`: measured, it puts a Linux binary on disk
# at mode 600 -- not executable. Info-ZIP `zip` writes the mode, so the archive is assembled where
# that tool is, and `tools/make_release.sh` extracts its own output and checks the bit rather than
# trusting it. That script is to this job what `tools/verify.ps1` is to the gate job: the logic in
# one file, runnable by a person against a checkout, called by CI rather than restated.
#
# # What this deliberately does not do
#
# **It does not decide that a release is ready.** Steps 1 to 5 of that checklist are a person
# running the gates and driving a real machine, and no workflow can stand in for the second one:
# the claims in `docs/smoke.md` need a target on a network, and a runner has none. So this job
# starts from the premise that the tag was pushed on purpose, after somebody did that.
#
# **It does not install anything.** The archive is files: two executables per platform, a client
# entry and a skill. Putting an agent on a target is still a file copy a person makes once, and
# `integrations/README.md` says so where somebody about to try it will read it.
#
# **It does not renumber anything.** The version in `Cargo.toml` and the tag have to agree, and the
# build refuses if they do not -- rather than releasing a binary whose `--version` disagrees with
# the tag it is attached to. That failure has already happened once by hand: a workspace version was
# bumped while five crates kept their own, so the binary reported 0.1.0 after the release was called
# 0.2.0. `crates/linklet-core/tests/architecture.rs` now fails on the cause; this is the check on
# the symptom, at the one moment it would reach a user.

name: release

on:
  push:
    tags: ["v*"]

# One release per tag, and no cancelling: a half-finished release is worse than a queued one, and
# the tag is already pushed either way.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  # Writing a release needs this and nothing else. The default token can read the repository; the
  # job is explicit about the one extra thing it wants.
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.triple }})

    # **One job definition over both platforms, not two jobs with the same steps.** The gates are
    # written down once, in `tools/verify.ps1`, and the build is one command; two job bodies would
    # copy both per platform. What does differ per platform is a name and an extension, which is
    # what the matrix carries.
    #
    # `fail-fast: false` because the two legs fail for different reasons and the answer about the
    # other platform is worth having: a release where Windows built and Linux did not is a fact
    # somebody can act on, and cancelling the second leg destroys it.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
            suffix: .exe
          - os: ubuntu-latest
            triple: x86_64-unknown-linux-gnu
            suffix: ""
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      # See the note in `verify.yml`: v4 runs on Node 20 and is being retired, and nothing local
      # catches that -- `actionlint` flags `@v3` and does not flag `@v4`.
      - uses: actions/checkout@v5

      - name: Install the pinned toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.95.0"

      - name: Cache the build
        uses: Swatinem/rust-cache@v2
        with:
          key: release

      # **The tag and the manifest have to agree**, checked before a single byte is built. The tag
      # is what a user downloads under; the manifest is what the binary reports when asked. A
      # release where those disagree is a release that lies about itself quietly.
      - name: The tag and Cargo.toml agree
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}" -replace '^v', ''
          $line = Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"'
          if (-not $line) { Write-Error "no version in [workspace.package]"; exit 1 }
          $manifest = $line.Matches[0].Groups[1].Value

          Write-Host "tag says      : $tag"
          Write-Host "Cargo.toml says: $manifest"

          if ($tag -ne $manifest) {
            Write-Error "tag v$tag does not match the workspace version $manifest. Bump Cargo.toml in a commit the tag points at, or tag the right commit. See docs/VERSIONING.md."
            exit 1
          }

      # The gates, again, on the exact commit being released -- and now on both platforms, which is
      # the same argument as `verify.yml`: the adapter layer has a backend per platform and neither
      # half is visible from the other. It is not redundant with the branch run: a tag can be
      # pushed on a commit whose branch run was cancelled, and a release is the worst place to find
      # that out.
      - name: Verify
        shell: pwsh
        run: ./tools/verify.ps1

      # `--locked` because the whole point of a release is that it is the thing that was verified.
      # A build that quietly resolved a newer dependency is a different artifact from the one the
      # gates passed on.
      - name: Build the release binaries
        shell: pwsh
        run: cargo build --workspace --release --locked

      # **The handover format is the directory name.** The artifact is named for the target triple
      # and holds the two executables at its root, so `actions/download-artifact` gives the
      # assembling job a directory per platform with exactly the names `tools/make_release.sh`
      # expects. `if-no-files-found: error` because an artifact that is empty because a path was
      # misspelled is the failure this release exists to not have.
      - name: Upload the two binaries
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.triple }}
          if-no-files-found: error
          path: |
            target/release/linklet${{ matrix.suffix }}
            target/release/linklet-agent${{ matrix.suffix }}

  publish:
    name: assemble and attach
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # On a tag push this checks out the tag, which is where the payload files come from: nothing
      # in the archive except `bin/` is built, and a file that is not in the tag cannot be in the
      # release.
      - uses: actions/checkout@v5

      # Default behaviour, which is what is wanted: one directory per artifact, named for it, so
      # the triples arrive as the directory names the enclosing script reads.
      - name: Download both platforms' binaries
        uses: actions/download-artifact@v8
        with:
          path: dist/binaries

      # `bash` rather than `./`: this repository is developed on Windows, where git does not record
      # the executable bit, so a checkout there does not have it and calling the script by name
      # would fail for a reason that has nothing to do with the release.
      - name: Assemble the archive, the digest and the notes
        shell: bash
        run: |
          bash tools/make_release.sh "${GITHUB_REF_NAME#v}" dist/binaries dist "$GITHUB_REPOSITORY"

      # `gh` rather than a third-party action: it is already on the runner, it is GitHub's own, and
      # a release job is not the place to add a dependency nobody reviews.
      - name: Attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # `--verify-tag` so this cannot invent a tag that was not pushed.
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" \
            --notes-file dist/notes.md \
            "dist/linklet-${GITHUB_REF_NAME#v}.zip" dist/SHA256SUMS
