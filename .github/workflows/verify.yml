# Every gate, on every push and every pull request.
#
# **This calls `tools/verify.ps1` and does not restate the four commands.** That script exists
# because the rules were written in three files and a commit still went in red -- and its own
# header names CI as one of the callers that must go through it. Four commands copied into a
# workflow is the same mistake one level up: two lists that drift, with the CI copy being the one
# nobody runs locally.
#
# # Why Windows and Linux
#
# **Both, because the adapter layer has two halves and each one is the other's blind spot.**
# `linklet` drove only Windows when this file was written, and it said so here: the tests spawned
# `tasklist`, `taskkill`, `ipconfig` and `route` unconditionally, so a Linux job would have been a
# red X meaning "wrong operating system" rather than anything about the change. `docs/ROADMAP.md`
# M11 made that reasoning false -- the process, discovery and shell modules now have a backend per
# platform, and `docs/testing.md` records the rest -- so the job that was refused for a good reason
# is now the job that covers the half Windows cannot.
#
# **What the second platform buys is not "it also compiles".** It is the two defects M11 found by
# running this suite there by hand: a case-insensitive root comparison that let an absolute path
# out of the root on a POSIX filesystem, and a search whose Windows-only program was an unused
# import everywhere else. The first was a live escape on every Linux agent; the second fails
# `cargo clippy -- -D warnings` on Linux and had never been looked at there. Neither can be found
# from Windows, and a job that runs on one platform is a job that will keep not finding them.
#
# # What passing this does not mean
#
# It does not mean the tool works on a LAN. No test here touches a second machine -- the
# real-machine layer is the seven claims in `docs/smoke.md`, which need a target and therefore
# cannot be a gate. `docs/testing.md` is the argument, and `docs/smoke.md` is what the missing
# layer claims.

name: verify

on:
  push:
    branches: ["**"]
  pull_request:

# A second push to the same branch makes the first run's answer irrelevant. Cancelling it saves a
# runner and removes a queue of stale red X's from the branch.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # A warning nobody reads is a warning that is allowed to stay; `verify.ps1` passes `-D warnings`
  # to clippy for the same reason. This makes cargo itself as strict about deprecations.
  RUSTFLAGS: -D warnings

jobs:
  verify:
    name: verify (${{ matrix.os }})
    # **One job definition over two runners, not two jobs with the same steps.** The four gates
    # are written down once, in `tools/verify.ps1`, and this file's whole reason for existing is
    # that there is one place they are written down; two jobs would be that mistake a third time,
    # with the steps copied per platform.
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
      # **A failure on one platform must not cancel the other.** The two fail for different
      # reasons, and "is Linux still green" is the question this job was added to answer -- the
      # default `fail-fast` would cancel the second leg and take the answer with it.
      fail-fast: false
    runs-on: ${{ matrix.os }}

    # The suite builds the workspace and runs ~570 tests that each spawn a real agent process. It
    # takes about ten minutes locally; twenty is the point at which something is wrong rather than
    # slow, and a hung run should fail instead of holding a runner for six hours.
    timeout-minutes: 20

    steps:
      # **`@v5` and not `@v4`, because v4 runs on Node 20 and GitHub is retiring it.** The first
      # version of this file pinned v4 and GitHub sent a deprecation warning on the first push;
      # v5's `action.yml` says `using: node24`.
      #
      # This is the one class of failure that nothing local catches. `actionlint` knows about
      # runtimes and flags `actions/checkout@v3`, but not `@v4` -- its staleness threshold lags
      # GitHub's deprecation -- so the pin is checked by reading the action's own `action.yml`
      # rather than by a test here. `docs/VERSIONING.md` has the procedure.
      - uses: actions/checkout@v5

      # **The toolchain is not named here.** `rust-toolchain.toml` pins it and carries the reason
      # -- "it compiles on my machine" is almost always a toolchain difference. Restating the
      # version in this file would give the pin a second place to be wrong.
      #
      # `components` is requested explicitly because the pinned file's `components` are honoured
      # by rustup when it *installs* a toolchain, and the runner already has one: asking for them
      # here is what guarantees `cargo fmt` and `cargo clippy` exist rather than being one
      # runner-image change away from missing.
      - name: Install the pinned toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy

      # Keyed on `Cargo.lock`, which is committed on purpose: it is the only record of the exact
      # versions a build was verified against. `target/` is several GB and is a pure function of
      # the source, which is why it is ignored rather than stored.
      #
      # **The two platforms do not share this cache and do not evict each other.** `key` is added
      # alongside the key the action builds itself, and that one carries the rustc host triple --
      # `x86_64-pc-windows-msvc` on one leg, `x86_64-unknown-linux-gnu` on the other. The `key`
      # below is for the same reason the release job has one of its own: a different profile
      # sharing this key would have each build evict the other's artifacts.
      - name: Cache the build
        uses: Swatinem/rust-cache@v2
        with:
          key: debug

      # One step, because the script is the definition of done. If a gate is added it is added
      # there, and this workflow picks it up without being edited -- which is the whole reason the
      # script exists.
      #
      # `pwsh` and not `bash`: the script is the same script on both runners, and PowerShell 7 is
      # preinstalled on the Ubuntu image -- so the alternative, a second shell script for one
      # platform, would be the two-lists mistake this arrangement exists to avoid.
      - name: Verify
        shell: pwsh
        run: ./tools/verify.ps1

      # Printed only when something failed, and printed *from the binaries this run built*: an
      # issue that is about which version a binary reports is exactly the class of bug that got
      # through once already (see `docs/VERSIONING.md`, step 4). Cheap evidence to have attached
      # to a failed run.
      - name: What the binaries say they are
        if: failure()
        shell: pwsh
        run: |
          cargo metadata --format-version 1 --no-deps |
            ConvertFrom-Json |
            Select-Object -ExpandProperty packages |
            ForEach-Object { "  {0,-20} {1}" -f $_.name, $_.version }
