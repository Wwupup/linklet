# ---------------------------------------------------------------------------
# The workspace root manifest. It holds no source code: it exists to (a) give
# the crates one shared target/ directory and one Cargo.lock, and (b) hold the
# rules that every crate inherits.
#
# Separate crates make dependency direction explicit; Cargo rejects cycles.
# Keeping I/O out of core also requires review of std and dependency API usage.
# ---------------------------------------------------------------------------
[workspace]
resolver = "3"
members = [
    "crates/linklet-core",
    "crates/linklet-adapters",
    "crates/linklet-cli",
    "crates/linklet-agent",
    "crates/linklet-client",
]

[workspace.dependencies]
serde_json = "1.0.151"

[workspace.package]
version = "0.6.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"

# Inherited by every crate with `[lints] workspace = true`. These are the
# quality bar; the list should stay short enough that every entry is
# understood, and every entry is here because it caught something.
[workspace.lints.rust]
unsafe_code = "forbid"          # no unsafe anywhere; ask before adding an exception
missing_docs = "warn"           # a public item with no doc comment is unexplained
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
todo = "warn"                   # a TODO that reaches a release is a known lie
dbg_macro = "deny"
unwrap_used = "warn"            # unwrap in library code is a panic waiting for input
